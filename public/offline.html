<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · BIG Premium Cuts</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120e0c; color: #efe6d3;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 360px; background: #1b1613; border: 1px solid #2f2721; border-radius: 3px; padding: 24px; text-align: center; }
    img { height: 64px; width: auto; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 22px; margin: 12px 0 8px; }
    p { font-size: 15px; line-height: 1.55; color: #a79c8b; }
    button { background: #c8a25a; color: #14100c; border: 0; border-radius: 3px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/big-logo.png" alt="BIG Premium Cuts" />
    <h1>You're offline</h1>
    <p>BIG Premium Cuts needs a connection to load your orders. Your order updates and delivery codes still arrive by SMS.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
