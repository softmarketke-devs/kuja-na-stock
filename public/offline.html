<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Kuja Na Stock</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
           font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 16px; box-sizing: border-box; }
    main { max-width: 360px; background: #fff; border: 1px solid #e2e8f0; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 8px; text-transform: uppercase; }
    p { font-size: 14px; line-height: 1.5; color: #334155; }
    button { background: #ea580c; color: #fff; border: 0; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Kuja Na Stock needs a connection to load your orders. Your order updates and delivery codes still arrive by SMS.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
